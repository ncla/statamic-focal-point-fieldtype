name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-dev

      - name: Install front-end dependencies
        run: npm ci

      - name: Compile assets
        run: npm run build

      - name: Create dist archive
        run: tar -czvf dist.tar.gz -C resources dist

      - name: Create release and upload dist
        uses: softprops/action-gh-release@v2
        with:
          files: dist.tar.gz
